name: Limpar imagens antigas

# Toda segunda de madrugada: mantém as 60 versões mais recentes de cada
# imagem no GHCR (api, web, whatsapp) e apaga o resto. Dá pra rodar na mão.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch: {}

jobs:
  limpar:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, whatsapp]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: sheikcell-crm-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 60
          delete-only-untagged-versions: false
