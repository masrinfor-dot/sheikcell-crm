name: App Windows (desktop)

# Gera o instalador Windows (.exe) do Sheikcell CRM com Tauri 2.
# Baixar: aba "Releases" do GitHub (tag desktop-v<versão>) ou, em qualquer
# execução, em Actions › esta execução › Artifacts.
on:
  push:
    branches: [desktop-offline, producao]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Instalar Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Compilar e empacotar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          tagName: desktop-v__VERSION__
          releaseName: "Sheikcell CRM para Windows v__VERSION__"
          releaseBody: "Baixe o arquivo terminado em -setup.exe e execute. Não precisa de administrador."
          releaseDraft: false
          prerelease: ${{ github.ref != 'refs/heads/producao' }}

      - uses: actions/upload-artifact@v4
        with:
          name: sheikcell-crm-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
