name: App Windows (desktop)

# Gera o instalador Windows (.exe) do Sheikcell CRM com Tauri 2.
# Baixar: aba "Releases" do GitHub (tag desktop-v<versão>) ou, em qualquer
# execução, em Actions › esta execução › Artifacts.
on:
  push:
    branches: [desktop-offline, producao]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Instalar Tauri CLI
        run: npm install --no-audit --no-fund

      - name: Compilar e empacotar
        shell: pwsh
        run: |
          npx tauri build *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log -Tail 40 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: sheikcell-crm-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar em Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "desktop-v$v"
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $pre = if ("${{ github.ref }}" -eq "refs/heads/producao") { @() } else { @("--prerelease") }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe.FullName --target "${{ github.sha }}" --title "Sheikcell CRM para Windows v$v" --notes "Baixe o arquivo terminado em -setup.exe e execute. Não precisa de administrador." @pre
          } else {
            gh release upload $tag $exe.FullName --clobber
          }
