kind = "web"
previewPath = "/"
title = "Análise de Negócio - Live Regional"
version = "1.0.0"
id = "artifacts/analise-negocio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24072

[services.development]
run = "pnpm --filter @workspace/analise-negocio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/analise-negocio", "run", "build" ]
publicDir = "artifacts/analise-negocio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24072"
BASE_PATH = "/"
