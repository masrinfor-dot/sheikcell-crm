map $http_upgrade $connection_upgrade {
  default upgrade;
  "" "";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Encaminha as chamadas de API para o serviço "api" do EasyPanel.
  # Host interno padrão: <projeto>_<serviço> (projeto "sheik", serviço "api").
  location /api/ {
    proxy_pass http://sheik_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  # SPA: qualquer rota desconhecida devolve o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
