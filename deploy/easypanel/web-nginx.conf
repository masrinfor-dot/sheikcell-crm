map $http_upgrade $connection_upgrade {
  default upgrade;
  "" "";
}

# Preserva o X-Forwarded-Proto vindo do proxy externo (Traefik/EasyPanel).
# O TLS termina antes do nginx, então $scheme aqui seria sempre "http" e o
# cookie de sessão "secure" da API seria recusado.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Encaminha as chamadas de API para o serviço "api" do EasyPanel.
  # Host interno padrão: <projeto>_<serviço> (projeto "sheik", serviço "api").
  location /api/ {
    # Fotos/documentos são enviados em base64 no JSON — o padrão do nginx (1m)
    # bloqueava qualquer foto real com 413.
    client_max_body_size 30m;
    proxy_pass http://sheik_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  # Assets com hash no nome (Vite) nunca mudam de conteúdo sob a mesma URL —
  # cache longo e imutável é seguro.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html é o único arquivo que muda a cada deploy (referencia os
  # assets com hash certos) — sem isso, HTML em cache pode apontar pra um
  # bundle que já não existe mais no servidor depois do próximo deploy,
  # e a tela fica em branco.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # SPA: qualquer rota desconhecida devolve o index.html
  location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
