# Configuração do Nginx para o Sheikcell.
# Copie para /etc/nginx/sites-available/sheikcell e crie o symlink em
# /etc/nginx/sites-enabled/. Troque SEU_DOMINIO.com pelo seu domínio.
#
# O Nginx faz o papel do "proxy" do Replit:
#   - /api  -> API Node (porta 8080)
#   - /     -> frontend estático (SPA) buildado pelo Vite
#
# Depois rode:  sudo certbot --nginx -d SEU_DOMINIO.com   para habilitar HTTPS.

server {
    listen 80;
    server_name SEU_DOMINIO.com;

    # Aumenta o limite de upload (mídias do WhatsApp)
    client_max_body_size 25m;

    # ── API (Express) ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O sistema usa SSE (atualizações em tempo real). Estas linhas são
        # OBRIGATÓRIAS para o chat ao vivo funcionar através do Nginx.
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # ── Frontend estático (SPA) ──────────────────────────────────────────────
    root /var/www/sheikcell/artifacts/sheikcell/dist/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
